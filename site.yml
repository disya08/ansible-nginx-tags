---
- name: Настройка кастомного веб-сайта на Nginx с тегами
  hosts: webservers
  become: true
  vars:
    app_name: "Tagged Cerium App"
    root_dir: "/var/www/amber_site"
    nginx_port: 8083

  tasks:
    - name: Установка Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes
      tags: package

    - name: Запуск и добавление Nginx в автозагрузку
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: package

    - name: Создание корневого каталога сайта
      ansible.builtin.file:
        path: "{{ root_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      tags: config

    - name: Формирование главной HTML-страницы из шаблона
      ansible.builtin.template:
        src: "templates/index.html.j2"
        dest: "{{ root_dir }}/index.html"
        owner: www-data
        group: www-data
        mode: "0644"
      tags: config

    - name: Формирование конфигурации Nginx из шаблона
      ansible.builtin.template:
        src: "templates/nginx.conf.j2"
        dest: "/etc/nginx/nginx.conf"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx config
      tags: config

  handlers:
    - name: Reload nginx config
      ansible.builtin.service:
        name: nginx
        state: reloaded
